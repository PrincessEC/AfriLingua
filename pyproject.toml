[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "afrilingua"
version = "2.0.0.dev0"
description = "Fast, lightweight, offline-first African-language AI translation & speech library — Python SDK, OpenAI-compatible & MCP server, live interpretation, and community LoRA/adapter training."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "AfriLingua contributors" }]
keywords = ["translation", "speech", "african-languages", "igbo", "yoruba", "hausa", "mcp", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core: enough to run text translation + translation memory on CPU.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "torch>=2.3",
    "soundfile>=0.12",
    "soxr>=0.4",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Fast CPU inference backends (int8). Strongly recommended.
fast = [
    "ctranslate2>=4.4",
    "faster-whisper>=1.1",
    "onnxruntime>=1.18",
    "silero-vad>=5.1",
]
# Live microphone capture / playback on the host machine.
audio = ["sounddevice>=0.4.6"]
# Fallback English ASR / TTS when fast backends are unavailable.
legacy = ["openai-whisper>=20231117", "pyttsx3>=2.90"]
detect = ["lingua-language-detector>=2.0"]
documents = ["pymupdf>=1.24", "python-docx>=1.1"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "mcp>=2.0",
]
desktop = ["pywebview>=5.1"]
train = ["datasets>=2.19", "sacrebleu>=2.4", "evaluate>=0.4", "accelerate>=0.29", "peft>=0.11"]
all = ["afrilingua[fast,audio,detect,documents,server]"]
dev = [
    "afrilingua[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
afrilingua = "afrilingua.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["afrilingua"]

[tool.hatch.build.targets.sdist]
include = ["afrilingua", "README.md", "LICENSE"]

# ── Tooling ─────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src", "api", "ui", "data", "web", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["afrilingua"]

[tool.mypy]
python_version = "3.11"
packages = ["afrilingua"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not models'"
markers = [
    "models: tests that download/load real ML models (slow; run with -m models)",
]
asyncio_mode = "auto"
