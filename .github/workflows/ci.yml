name: CI

on:
  push:
    branches: [main, "overhaul/**"]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install (CPU torch)
        run: uv pip install --system --python ${{ matrix.python }} -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
        shell: bash
      - name: Lint
        run: ruff check afrilingua tests && ruff format --check afrilingua tests
      - name: Type check
        run: mypy
        continue-on-error: true
      - name: Fast tests (no model downloads)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
