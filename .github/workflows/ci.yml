name: CI

on:
  push:
    branches: [main, dev, "overhaul/**", "v2/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU-only torch)
        shell: bash
        run: >
          uv pip install --system -e ".[dev]"
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match
      - name: Lint
        run: |
          ruff check afrilingua tests
          ruff format --check afrilingua tests
      - name: Type check (advisory)
        run: mypy
        continue-on-error: true
      - name: Fast tests (no model downloads)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
